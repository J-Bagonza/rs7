<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Important Message 😊</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
      cursor: default;
    }

    .bg {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at 20% 50%, #1a0a2e 0%, #0d0d0d 60%);
      z-index: 0;
    }

    /* Fake loading spinner shown first */
    #loader {
      position: fixed; inset: 0;
      background: #0d0d0d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 20px;
    }

    .spinner {
      width: 52px; height: 52px;
      border: 5px solid #222;
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loader p {
      color: #888;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
    }

    /* Main content */
    #content {
      position: relative; z-index: 1;
      text-align: center;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 40px 30px;
    }

    .emoji {
      font-size: 5rem;
      animation: bounce 1s ease infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-18px); }
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(2rem, 8vw, 4rem);
      color: #fff;
      text-shadow: 0 0 30px #a855f7, 0 0 60px #7c3aed;
      letter-spacing: 0.02em;
    }

    p.sub {
      color: #aaa;
      font-size: 1rem;
      max-width: 320px;
      line-height: 1.6;
    }

    /* Volume bar animation */
    .bars {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 50px;
      margin-top: 10px;
    }

    .bar {
      width: 10px;
      border-radius: 4px 4px 0 0;
      background: linear-gradient(to top, #7c3aed, #ec4899);
      animation: bar-bounce 0.5s ease infinite alternate;
    }

    .bar:nth-child(1) { animation-delay: 0.0s; }
    .bar:nth-child(2) { animation-delay: 0.1s; }
    .bar:nth-child(3) { animation-delay: 0.2s; }
    .bar:nth-child(4) { animation-delay: 0.3s; }
    .bar:nth-child(5) { animation-delay: 0.4s; }
    .bar:nth-child(6) { animation-delay: 0.2s; }
    .bar:nth-child(7) { animation-delay: 0.1s; }

    @keyframes bar-bounce {
      from { height: 8px; }
      to   { height: 45px; }
    }

    /* Glitch text */
    .glitch {
      color: #ec4899;
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      animation: glitch 2s infinite;
    }

    @keyframes glitch {
      0%, 90%, 100% { transform: none; opacity: 1; }
      92% { transform: translateX(-3px); opacity: 0.8; }
      94% { transform: translateX(3px); opacity: 0.9; }
      96% { transform: translateX(-2px); opacity: 0.7; }
    }

    /* Particles */
    .particles {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }
    .particle {
      position: absolute;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: #a855f7;
      opacity: 0;
      animation: float-up 4s ease-in infinite;
    }

    @keyframes float-up {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      20%  { opacity: 0.7; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body>

<div class="bg"></div>

<!-- Fake loader to trick the user into waiting (interaction bypass) -->
<div id="loader">
  <div class="spinner"></div>
  <p>Loading important message...</p>
</div>

<!-- Main prank content -->
<div id="content">
  <div class="emoji">🔊</div>
  <h1>GOT YOU! 😂</h1>
  <div class="bars">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div>
  </div>
  <p class="sub">You just got pranked by your friend. Hope your speakers survived! 🎶💀</p>
  <p class="glitch">MAXIMUM VOLUME ACTIVATED</p>
</div>

<!-- Floating particles -->
<div class="particles" id="particles"></div>

<script>
  // ── CUSTOMIZE YOUR SOUND HERE ──────────────────────────────────────────────
  // Replace this URL with any direct .mp3 / .ogg link, or a base64 data URI.
  // Free loud prank sounds:
  //   • Airhorn: https://www.myinstants.com/media/sounds/air-horn-club-sample.mp3
  //   • Screaming goat: https://www.myinstants.com/media/sounds/goat.mp3
  //   • Windows XP error: freely available on archive.org
  //
  // To use a local file, convert it to base64 and replace the src below.
  const SOUND_URL = "https://www.myinstants.com/media/sounds/air-horn-club-sample.mp3";
  // ──────────────────────────────────────────────────────────────────────────

  const audio = new Audio(SOUND_URL);
  audio.loop = false;

  // Autoplay bypass: start muted (allowed by browsers), then instantly unmute
  audio.muted = true;
  audio.volume = 1.0;

  // After a short "loading" fake screen, play the sound
  setTimeout(() => {
    audio.play().then(() => {
      audio.muted = false; // UNMUTE → full blast
    }).catch(() => {
      // If still blocked, wait for ANY user interaction
      const unlock = () => {
        audio.muted = false;
        audio.play();
        document.removeEventListener('click', unlock);
        document.removeEventListener('touchstart', unlock);
      };
      document.addEventListener('click', unlock);
      document.addEventListener('touchstart', unlock);
    });

    // Show the reveal screen
    document.getElementById('loader').style.display = 'none';
    const c = document.getElementById('content');
    c.style.display = 'flex';

    // Spawn particles
    const container = document.getElementById('particles');
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDelay = (Math.random() * 4) + 's';
      p.style.animationDuration = (3 + Math.random() * 3) + 's';
      p.style.background = ['#a855f7','#ec4899','#f97316','#facc15'][Math.floor(Math.random()*4)];
      container.appendChild(p);
    }
  }, 2500); // fake loading for 2.5 seconds
</script>
</body>
</html>
